<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Native tree fixture</title>
<link rel="stylesheet" href="/options.css">
<link rel="stylesheet" href="/content.css">
<style>
html,body{margin:0;width:100%;height:100%;min-width:0;font:13px Arial,sans-serif}.console-dashboard-layout{display:flex;min-height:1100px}.console-dashboard-layout__aside{position:sticky;top:0;width:360px;height:100vh;border-right:1px solid #ddd;flex-shrink:0}.console-dashboard-layout__wrapper{min-width:600px;flex:1;padding:20px}.cloud-tree-list-container{display:flex;flex-direction:column;height:100%;background:white}.cloud-tree-list-container__search{display:flex;align-items:center;gap:4px;height:40px;padding:4px}.cloud-tree-list-container__search input{flex:1;min-width:0}.cloud-tree-list{flex:1;min-height:0;overflow:auto}.cloud-tree-list ul{position:relative;margin:0;padding:0;list-style:none}.native-row{position:absolute;top:0;left:0;width:100%;height:36px}.native-org{background:white;z-index:2}.native-item{height:36px;display:flex;align-items:center;padding-left:12px;box-sizing:border-box}.native-item a{color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.native-folder{padding-left:30px}.cloud-tree-list-item__title{font:13px/18px Arial,sans-serif}.header-icon{width:24px;height:24px}.fixture-controls{font-size:12px;color:#666}
</style>
</head>
<body class="g-root g-root_theme_light-hc">
<div class="console-dashboard-layout">
<aside class="console-dashboard-layout__aside">
<div class="cloud-tree-list-container">
<svg width="0" height="0" style="position:absolute"><defs><g id="shared-cloud"><rect x="2" y="2" width="12" height="12" fill="#348fff"/></g></defs></svg>
<div class="cloud-tree-list-container__search"><input placeholder="Filter by cloud and folder"><button type="button" id="native-toggle" aria-label="Toggle original sidebar">▥</button></div>
<div class="cloud-tree-list"><ul id="fixture-rows"></ul></div>
</div>
</aside>
<main class="console-dashboard-layout__wrapper"><svg class="header-icon" viewBox="0 0 16 16"><use href="#shared-cloud"/></svg><h1>Console fixture</h1><p class="fixture-controls">Synthetic data for Firefox UI regression checks</p></main>
</div>
<script>
const scenario=new URLSearchParams(location.search).get('scenario')||'small';
const records=[];
const opened=new Set(),loaded=new Set();let expansionClicks=0;
const org=(id,name)=>records.push({type:'organization',id,name});
const cloud=(id,name)=>records.push({type:'cloud',id,name});
const folder=(id,name,cloudId)=>records.push({type:'folder',id,name,cloudId});
org('org-alpha','Alpha organization');
if(scenario==='virtual')for(let n=0;n<30;n++)cloud('cloud-'+n,'Cloud '+n);
else{
 cloud('cloud-alpha','Alpha core');folder('folder-alpha','Alpha folder','cloud-alpha');
 if(scenario==='delayed-controls')for(let n=0;n<30;n++)cloud('cloud-extra-'+n,'Extra cloud '+n);
 if(scenario==='cloud-order-scroll')for(let n=0;n<24;n++)folder('folder-extra-'+n,'Extra folder '+n,'cloud-alpha');
 cloud('cloud-analytics','Analytics');folder('folder-analytics','Analytics folder','cloud-analytics');
 if(scenario.startsWith('multi'))org('org-beta','Beta organization');
 cloud('cloud-beta','Beta core');folder('folder-beta','Beta folder','cloud-beta');
}
const list=document.querySelector('.cloud-tree-list'),ul=document.getElementById('fixture-rows');ul.style.height=records.length*36+'px';
function renderRows(){
 if(scenario==='empty-cache'&&window.fixture)return;
 if(getComputedStyle(document.querySelector('.cloud-tree-list-container')).visibility==='hidden')return;
 const first=Math.max(0,Math.floor(list.scrollTop/36)-2),last=Math.min(records.length,Math.ceil((list.scrollTop+list.clientHeight)/36)+2);
 const visible=records.map((row,index)=>({row,index})).filter(({row,index})=>(!scenario.startsWith('delayed')||row.type!=='folder'||opened.has(row.cloudId)&&loaded.has(row.cloudId))&&(row.type==='organization'||index>=first&&index<last));
 ul.replaceChildren(...visible.map(({row,index})=>{
  const li=document.createElement('li');li.className='native-row'+(row.type==='organization'?' native-org':'');li.style.transform='translateY('+(index*36)+'px)';
  const item=document.createElement('div');item.className='native-item cloud-tree-list-item__item cloud-tree-list-item__item_opened'+(row.type==='folder'?' native-folder':'');item.dataset.listItem=row.type+'.'+row.id;item.tabIndex=0;
  const a=document.createElement('a');a.className='cloud-tree-list-item__title';a.title=row.name;a.textContent=row.name;a.href=row.type==='organization'?'https://example.com/organizations/'+row.id:row.type==='cloud'?'/clouds/'+row.id:'/clouds/'+row.cloudId+'/'+row.id;
  if(scenario.startsWith('delayed')&&row.type==='cloud'){
   const button=document.createElement('button');button.type='button';button.className='cloud-tree-list-item__expand-button';button.setAttribute('aria-expanded',String(opened.has(row.id)));
   const icon=document.createElement('span');icon.className='cloud-tree-list-item__expand-icon'+(opened.has(row.id)?' cloud-tree-list-item__expand-icon_expanded':'');icon.textContent='›';button.append(icon);
   button.onclick=()=>{expansionClicks++;if(opened.has(row.id)){opened.delete(row.id);renderRows();return}opened.add(row.id);item.setAttribute('aria-busy','true');setTimeout(()=>{loaded.add(row.id);renderRows()},750)};
   item.append(button);
  }
  item.append(a);li.append(item);return li;
 }));
}
list.addEventListener('scroll',()=>requestAnimationFrame(renderRows));renderRows();
const saved=JSON.parse(sessionStorage.getItem('fixture:'+scenario)||'null');const memory=saved||{};const listeners=[];
if(!saved&&(scenario.startsWith('delayed')||scenario==='multi-saved'||scenario==='expand-state'||scenario==='folder-icons'||scenario.startsWith('cloud-order')))memory['yc-power:'+location.origin+':organization:id:org-alpha']={mine:['cloud-alpha'],initialized:true,width:320,custom:{},showAllModern:false};
window.browser={storage:{local:{get:async key=>key===null?structuredClone(memory):{[key]:structuredClone(memory[key])},set:async values=>{const changes={};for(const [key,value]of Object.entries(values)){changes[key]={oldValue:memory[key],newValue:structuredClone(value)};memory[key]=structuredClone(value)}sessionStorage.setItem('fixture:'+scenario,JSON.stringify(memory));listeners.forEach(fn=>fn(changes,'local'))}},onChanged:{addListener:fn=>listeners.push(fn)}}};
history.replaceState(null,'','/clouds');
if(!saved&&scenario==='multi-saved'){const k='yc-power:'+location.origin+':organization:id:org-beta';memory[k]={mine:['cloud-beta'],initialized:true,width:320,custom:{}};delete memory['yc-power:'+location.origin+':organization:id:org-alpha'];memory['yc-power:'+location.origin+':layout']={scopeKey:k,width:320}}
if(!saved&&(scenario==='delayed-cache'||scenario==='empty-cache'))memory['yc-power:'+location.origin+':catalog']=[{type:'cloud',id:'cloud-alpha',name:'Alpha core',href:'/clouds/cloud-alpha',organizationId:'org-alpha',organizationName:'Alpha organization',folders:[{type:'folder',id:'folder-old',name:'Cached folder',href:'/clouds/cloud-alpha/folder-old',cloudId:'cloud-alpha'}]}];
if(!saved&&scenario==='expand-state')memory['yc-power:'+location.origin+':organization:id:org-alpha'].mine.push('cloud-beta');
if(!saved&&scenario==='cloud-order')memory['yc-power:'+location.origin+':organization:id:org-alpha'].mine=['cloud-alpha','cloud-analytics','cloud-beta'];
if(!saved&&scenario==='cloud-order-scroll')memory['yc-power:'+location.origin+':organization:id:org-alpha'].mine=['cloud-alpha','cloud-beta'];
const widths=[];
new MutationObserver(()=>{const host=document.querySelector('[data-ycp-host]');if(host)widths.push(host.parentElement.getBoundingClientRect().width)}).observe(document.querySelector('.console-dashboard-layout__aside'),{childList:true,subtree:true,attributes:true});
window.fixture={scenario,records,memory,renderRows,widths,get expansionClicks(){return expansionClicks}};
if(scenario==='failed')document.querySelector('.cloud-tree-list').remove();
if(scenario==='empty-cache'){ul.replaceChildren();ul.style.height='0';const empty=document.createElement('div');empty.className='g-placeholder-container';empty.textContent='No clouds';ul.append(empty);list.removeEventListener('scroll',renderRows)}
if(scenario==='small')document.querySelector('.cloud-tree-list-container').style.backgroundColor='rgb(243, 245, 247)';
</script>
<script src="/content.js"></script>
</body>
</html>
